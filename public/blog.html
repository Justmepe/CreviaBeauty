<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Ads (gtag.js) -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Beauty tips, guides, and edits from CreviaBeauty, wigs, fragrance, skincare and makeup advice for Kenyan beauty lovers.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://creviabeauty.com/blog">
<meta property="og:type" content="website">
<meta property="og:url" content="https://creviabeauty.com/blog">
<meta property="og:title" content="The Beauty Edit | CreviaBeauty Kenya">
<meta property="og:description" content="Wigs, fragrance, skincare and makeup guides for Kenyan beauty lovers.">
<meta property="og:image" content="https://creviabeauty.com/images/og-image.jpg">
<meta property="og:locale" content="en_KE">
<meta property="og:site_name" content="CreviaBeauty">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="The Beauty Edit | CreviaBeauty Kenya">
<meta name="twitter:description" content="Wigs, fragrance, skincare and makeup guides for Kenyan beauty lovers.">
<meta name="twitter:image" content="https://creviabeauty.com/images/og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css?v=7">
<style>
    /* styles.css has no .nav-content rules (it styles .nav-container), style the blog navbar here */
    .navbar .nav-content { max-width:1100px; margin:0 auto; padding:0.7rem 1.5rem; display:flex; align-items:center; justify-content:space-between; gap:1.25rem; }
    .navbar .logo { display:inline-flex; align-items:center; font-family:'Playfair Display', serif; font-size:1.5rem; font-weight:700; color:#fff; text-decoration:none; }
    .navbar .logo img { height:38px; width:38px; border-radius:50%; object-fit:cover; background:#fff; margin-right:10px; }
    .navbar .logo b { color:#d4af6a; }
    .navbar .nav-links { display:flex; gap:1.1rem; list-style:none; margin:0; padding:0; align-items:center; }
    .navbar .nav-links a { white-space:nowrap; }
    @media (max-width:640px) { .navbar .nav-links { display:none; } }

    .blog-hero { background: linear-gradient(120deg, #1a1a2e 0%, #2c2c54 70%, #3b2c50 100%); color:#fff; padding:3rem 1.5rem; text-align:center; }
    .blog-hero h1 { margin:0 0 0.4rem 0; font-size:2.2rem; font-family:'Playfair Display', serif; }
    .blog-hero p { opacity:0.9; }
    .blog-wrap { max-width:1100px; margin:2.5rem auto 3rem; padding:0 1.5rem; }
    .blog-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:1.5rem; }
    .blog-card { background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 2px 12px rgba(26,26,46,0.08); display:flex; flex-direction:column; cursor:pointer; transition:transform 0.18s, box-shadow 0.18s; height:100%; }
    .blog-card:hover { transform:translateY(-4px); box-shadow:0 12px 28px rgba(26,26,46,0.14); }
    .blog-img { height:190px; background-size:cover; background-position:center; transition:transform 0.4s ease; }
    .blog-card:hover .blog-img { transform:scale(1.04); }
    .blog-img-clip { overflow:hidden; }
    .blog-body { padding:1.25rem; }
    .blog-cat { font-size:0.72rem; text-transform:uppercase; letter-spacing:0.1em; color:#a8853f; font-weight:700; }
    .blog-title { font-family:'Playfair Display', serif; font-size:1.2rem; font-weight:700; margin:0.45rem 0; line-height:1.3; color:#1a1a2e; }
    .blog-excerpt { color:#555; font-size:0.9rem; line-height:1.55; }
    .blog-meta { color:#999; font-size:0.78rem; margin-top:0.7rem; }

    /* Featured (latest) article: full-width magazine card */
    .blog-featured { display:grid; grid-template-columns:1.2fr 1fr; background:#fff; border-radius:18px; overflow:hidden; box-shadow:0 4px 18px rgba(26,26,46,0.1); margin-bottom:1.75rem; cursor:pointer; transition:transform 0.18s, box-shadow 0.18s; }
    .blog-featured:hover { transform:translateY(-4px); box-shadow:0 14px 32px rgba(26,26,46,0.16); }
    .blog-featured .blog-img { height:100%; min-height:320px; }
    .blog-featured .blog-body { padding:2.2rem; display:flex; flex-direction:column; justify-content:center; }
    .blog-featured .blog-title { font-size:1.9rem; line-height:1.22; }
    .blog-featured .blog-excerpt { font-size:1rem; }
    .blog-featured-tag { display:inline-block; background:#d4af6a; color:#1a1a2e; font-size:0.68rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; border-radius:999px; padding:0.3rem 0.8rem; margin-bottom:0.8rem; align-self:flex-start; }
    @media (max-width:760px) { .blog-featured { grid-template-columns:1fr; } .blog-featured .blog-img { min-height:220px; } .blog-featured .blog-body { padding:1.5rem; } .blog-featured .blog-title { font-size:1.45rem; } }
</style>
</head>
<body>
<nav class="navbar">
    <div class="nav-content">
        <a href="/" class="logo"><img src="/assets/favicon.png?v=2" alt="CreviaBeauty">Crevia<b>Beauty</b></a>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/products">Products</a></li>
            <li><a href="/bundles">Bundles</a></li>
            <li><a href="/quiz">Quizzes</a></li>
            <li><a href="/blog" class="active">The Edit</a></li>
        </ul>
    </div>
</nav>

<section class="blog-hero" id="blog-hero">
    <h1>The Edit</h1>
    <p>Beauty guides, routines and product breakdowns from our team.</p>
</section>

<div id="blog-container"></div>

<footer>
    <div class="footer-content">
        <div class="footer-section"><h3>CreviaBeauty Kenya</h3><p>Premium beauty in Kenya.</p></div>
        <div class="footer-section"><h3>Quick Links</h3><ul><li><a href="/">Home</a></li><li><a href="/products">Products</a></li><li><a href="/quiz">Quizzes</a></li></ul></div>
    </div>
    <div class="footer-bottom"><p>&copy; 2026 CreviaBeauty Kenya. All rights reserved.</p></div>
</footer>

<script>
// Articles are DB-driven (published via the admin Content Studio).
// Cards link to server-rendered /blog/<slug> pages.
async function loadArticles() {
    const container = document.getElementById('blog-container');
    try {
        const response = await fetch('/api/articles');
        const articles = await response.json();

        if (!Array.isArray(articles) || articles.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#888; padding:3rem 1.5rem;">No articles yet, check back soon.</p>';
            return;
        }

        const [featured, ...rest] = articles;
        const img = a => (a.hero_image_url || '/assets/Logo.png?v=2').replace(/'/g, '%27');

        container.innerHTML = `
            <div class="blog-wrap">
                <a href="/blog/${encodeURIComponent(featured.slug)}" style="text-decoration:none; color:inherit;">
                    <article class="blog-featured">
                        <div class="blog-img-clip"><div class="blog-img" style="background-image:url('${img(featured)}')"></div></div>
                        <div class="blog-body">
                            <span class="blog-featured-tag">Latest</span>
                            <div class="blog-cat">${escapeText(featured.category || 'Beauty')}</div>
                            <h2 class="blog-title">${escapeText(featured.title)}</h2>
                            <p class="blog-excerpt">${escapeText((featured.intro || '').substring(0, 220))}${(featured.intro || '').length > 220 ? '…' : ''}</p>
                            <div class="blog-meta">${formatDate(featured.published_at)}</div>
                        </div>
                    </article>
                </a>
                <div class="blog-grid">
                    ${rest.map(a => `
                        <a href="/blog/${encodeURIComponent(a.slug)}" style="text-decoration:none; color:inherit;">
                            <article class="blog-card">
                                <div class="blog-img-clip"><div class="blog-img" style="background-image:url('${img(a)}')"></div></div>
                                <div class="blog-body">
                                    <div class="blog-cat">${escapeText(a.category || 'Beauty')}</div>
                                    <h3 class="blog-title">${escapeText(a.title)}</h3>
                                    <p class="blog-excerpt">${escapeText((a.intro || '').substring(0, 140))}${(a.intro || '').length > 140 ? '…' : ''}</p>
                                    <div class="blog-meta">${formatDate(a.published_at)}</div>
                                </div>
                            </article>
                        </a>
                    `).join('')}
                </div>
            </div>
        `;
    } catch (error) {
        container.innerHTML = '<p style="text-align:center; color:#e94560; padding:3rem 1.5rem;">Failed to load articles. Please refresh.</p>';
    }
}

function escapeText(text) {
    const div = document.createElement('div');
    div.textContent = text == null ? '' : String(text);
    return div.innerHTML;
}

function formatDate(dateStr) {
    if (!dateStr) return '';
    return new Date(dateStr).toLocaleDateString('en-KE', { year: 'numeric', month: 'long' });
}

loadArticles();
</script>
</body>
</html>
